name: karo_strength_training
description: "Karos Strength – a simple strength training log by Team BullPeak."
publish_to: 'none'

version: 1.1.0+8

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bullpeak_intro:
    path: ../_felles/packages/bullpeak_intro

  in_app_purchase: ^3.3.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/watermark_light.png
    - assets/watermark_dark.png
    - assets/emblem.png
    - assets/tegneserie_1.png
    - assets/tegneserie_2.png
    - assets/tegneserie_3.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#000000"
  color_dark: "#000000"
  image: assets/karo.png

